apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-kill-backend
  namespace: rheosim
spec:
  engineState: active
  appinfo:
    appns: rheosim
    applabel: app=rheosim-backend
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "15"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"
        probe:
          - name: backend-health-check
            type: httpProbe
            mode: Continuous
            httpProbe/inputs:
              url: http://rheosim-backend:8080/actuator/health
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            runProperties:
              probeTimeout: 5
              interval: 5
              retry: 3
              probePollingInterval: 2
