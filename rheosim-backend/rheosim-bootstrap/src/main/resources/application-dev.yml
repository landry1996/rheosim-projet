spring:
  # Database - Dev
  datasource:
    url: jdbc:postgresql://localhost:5432/rheosim_dev
    username: ${DB_USERNAME:rheosim}
    password: ${DB_PASSWORD:rheosim_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA - Dev
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # Kafka - Dev
  kafka:
    bootstrap-servers: localhost:9092

# Logging - Dev
logging:
  level:
    com.rheosim: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev-specific settings
rheosim:
  security:
    cors:
      allowed-origins: http://localhost:4200,http://localhost:4201
