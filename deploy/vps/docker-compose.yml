version: '3.9'

services:
  # =============================================================
  # REVERSE PROXY — Nginx + SSL (Let's Encrypt via Certbot)
  # =============================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: rheosim-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - frontend_dist:/usr/share/nginx/html/app:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rheosim-net

  certbot:
    image: certbot/certbot
    container_name: rheosim-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rheosim-net

  # =============================================================
  # DATABASE — PostgreSQL 15
  # =============================================================
  postgres:
    image: postgres:15-alpine
    container_name: rheosim-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rheosim}
      POSTGRES_USER: ${POSTGRES_USER:-rheosim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rheosim} -d ${POSTGRES_DB:-rheosim}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    networks:
      - rheosim-internal

  # =============================================================
  # MESSAGING — Apache Kafka (KRaft, no Zookeeper)
  # =============================================================
  kafka:
    image: bitnami/kafka:3.7
    container_name: rheosim-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_LOG_RETENTION_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    networks:
      - rheosim-internal

  # =============================================================
  # CACHE — Redis 7
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: rheosim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - rheosim-internal

  # =============================================================
  # BACKEND — Spring Boot API
  # =============================================================
  backend:
    build:
      context: ../../rheosim-backend
      dockerfile: Dockerfile
    container_name: rheosim-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rheosim}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rheosim}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN_NAME}}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xmx${BACKEND_MAX_HEAP:-512m}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    networks:
      - rheosim-net
      - rheosim-internal

  # =============================================================
  # FRONTEND — Angular (built, served by proxy)
  # =============================================================
  frontend:
    build:
      context: ../../rheosim-frontend
      dockerfile: Dockerfile
    container_name: rheosim-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    networks:
      - rheosim-net

  # =============================================================
  # ML SERVICE — FastAPI + gRPC
  # =============================================================
  ml-service:
    build:
      context: ../../rheosim-ml
      dockerfile: Dockerfile
    container_name: rheosim-ml
    environment:
      ML_ENV: production
      ML_LOG_LEVEL: info
      ML_GRPC_PORT: 50052
      ML_HTTP_PORT: 8000
      ML_DB_URL: postgresql://${POSTGRES_USER:-rheosim}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rheosim}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    networks:
      - rheosim-internal

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  frontend_dist:
    driver: local

networks:
  rheosim-net:
    driver: bridge
  rheosim-internal:
    driver: bridge
    internal: true
