apiVersion: apps/v1
kind: Deployment
metadata:
  name: rheosim-compute-gpu
  namespace: rheosim
  labels:
    app: rheosim-compute
    variant: gpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rheosim-compute
      variant: gpu
  template:
    metadata:
      labels:
        app: rheosim-compute
        variant: gpu
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: compute-gpu
          image: rheosim/compute:latest-gpu
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: RHEOSIM_GPU_MODE
              value: "auto"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rheosim-compute-gpu
  namespace: rheosim
spec:
  selector:
    app: rheosim-compute
    variant: gpu
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
  type: ClusterIP
