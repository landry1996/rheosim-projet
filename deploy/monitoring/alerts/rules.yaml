groups:
  - name: rheosim-service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "P95 latency is above 2s for {{ $labels.service }} for the last 5 minutes."

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is above 5% on {{ $labels.service }}."

  - name: rheosim-simulation
    rules:
      - alert: SimulationQueueBacklog
        expr: rheosim_active_jobs_count{status="queued"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Simulation queue backlog"
          description: "More than 50 jobs have been queued for over 10 minutes."

      - alert: SimulationFailureRate
        expr: sum(rate(rheosim_simulation_convergence_total{converged="false"}[1h])) / sum(rate(rheosim_simulation_convergence_total[1h])) > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High simulation failure rate"
          description: "More than 30% of simulations are failing to converge."

      - alert: SimulationDurationExceeded
        expr: histogram_quantile(0.95, sum(rate(rheosim_simulation_duration_seconds_bucket[15m])) by (le)) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Simulation duration too high"
          description: "P95 simulation duration exceeds 10 minutes."

  - name: rheosim-compute-engine
    rules:
      - alert: ComputeEngineCPUSaturation
        expr: rate(process_cpu_seconds_total{job="compute-engine"}[5m]) > 3.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Compute engine CPU near saturation"
          description: "Compute engine is using more than 3.5 CPU cores sustained."

      - alert: ComputeEngineMemoryHigh
        expr: process_resident_memory_bytes{job="compute-engine"} / 1024 / 1024 / 1024 > 3.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Compute engine memory usage high"
          description: "Compute engine is using more than 3.5 GB RAM."

  - name: rheosim-infrastructure
    rules:
      - alert: PostgreSQLConnectionPoolExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections near limit"
          description: "More than 80% of PostgreSQL connection slots are in use."

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high"
          description: "Consumer group {{ $labels.group }} has lag > 10000 on topic {{ $labels.topic }}."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low"
          description: "Less than 10% disk space remaining on {{ $labels.mountpoint }}."
