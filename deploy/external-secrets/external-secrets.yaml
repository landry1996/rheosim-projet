apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rheosim-backend-secrets
  namespace: rheosim
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rheosim-backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        application-vault.yml: |
          spring:
            datasource:
              username: "{{ .db_username }}"
              password: "{{ .db_password }}"
          jwt:
            secret: "{{ .jwt_secret }}"
          stripe:
            api-key: "{{ .stripe_api_key }}"
            webhook-secret: "{{ .stripe_webhook_secret }}"
          spring.mail:
            password: "{{ .email_password }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: secret/data/rheosim/jwt
        property: signing_key

    - secretKey: stripe_api_key
      remoteRef:
        key: secret/data/rheosim/stripe
        property: api_key

    - secretKey: stripe_webhook_secret
      remoteRef:
        key: secret/data/rheosim/stripe
        property: webhook_secret

    - secretKey: email_password
      remoteRef:
        key: secret/data/rheosim/email
        property: smtp_password

    - secretKey: db_username
      remoteRef:
        key: secret/data/rheosim/database
        property: username

    - secretKey: db_password
      remoteRef:
        key: secret/data/rheosim/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rheosim-ml-secrets
  namespace: rheosim
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rheosim-ml-secrets
    creationPolicy: Owner
  data:
    - secretKey: mlflow_tracking_uri
      remoteRef:
        key: secret/data/rheosim/mlflow
        property: tracking_uri

    - secretKey: mlflow_tracking_token
      remoteRef:
        key: secret/data/rheosim/mlflow
        property: tracking_token

    - secretKey: s3_access_key
      remoteRef:
        key: secret/data/rheosim/s3
        property: access_key

    - secretKey: s3_secret_key
      remoteRef:
        key: secret/data/rheosim/s3
        property: secret_key

    - secretKey: db_connection_string
      remoteRef:
        key: secret/data/rheosim/database
        property: ml_connection_string
