replicaCount: 2

image:
  repository: rheosim/identity-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rheosim_identity
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_ALGORITHM: RS256
  JWT_PRIVATE_KEY_PATH: /etc/secrets/jwt/private.pem
  JWT_PUBLIC_KEY_PATH: /etc/secrets/jwt/public.pem

secrets:
  - name: jwt-keypair
    mountPath: /etc/secrets/jwt

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

healthcheck:
  path: /actuator/health
  initialDelaySeconds: 20
  periodSeconds: 10
