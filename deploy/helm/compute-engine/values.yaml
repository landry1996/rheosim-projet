replicaCount: 2

image:
  repository: rheosim/compute-engine
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50051
  protocol: TCP

resources:
  requests:
    cpu: 2000m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 4Gi

env:
  RHEOSIM_MAX_CONCURRENT_JOBS: "4"
  RHEOSIM_LOG_LEVEL: "info"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 16
  targetCPUUtilizationPercentage: 60

healthcheck:
  grpcPort: 50051
  initialDelaySeconds: 10
  periodSeconds: 5

nodeSelector:
  compute: "true"

tolerations:
  - key: "compute"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
