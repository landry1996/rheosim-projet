apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-compute-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: compute-engine
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: 50051
      protocol: {{ .Values.service.protocol }}
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: compute-engine
