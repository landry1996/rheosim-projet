version: '3.9'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: rheosim-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rheosim_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rheosim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka (KRaft mode - no Zookeeper)
  kafka:
    image: bitnami/kafka:3.7
    container_name: rheosim-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Redis (cache + sessions)
  redis:
    image: redis:7-alpine
    container_name: rheosim-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Service (Python FastAPI + gRPC)
  ml-service:
    build:
      context: ../rheosim-ml
      dockerfile: Dockerfile
    container_name: rheosim-ml
    environment:
      RHEOSIM_ML_GRPC_PORT: "50052"
      RHEOSIM_ML_HTTP_PORT: "8000"
      RHEOSIM_ML_MODEL_DIR: "/app/models"
      RHEOSIM_ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:50052:50052"
    volumes:
      - ml_models:/app/models
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Kafka UI (development only)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rheosim-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: rheosim-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  ml_models:
