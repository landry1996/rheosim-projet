services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: rheosim-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rheosim_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rheosim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rheosim-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: rheosim-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rheosim-net

  redis:
    image: redis:7-alpine
    container_name: rheosim-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rheosim-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rheosim-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: rheosim-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rheosim-net

  # ─────────────────────────────────────────
  # SERVICES APPLICATIFS
  # ─────────────────────────────────────────

  ml-service:
    build:
      context: ../rheosim-ml
      dockerfile: Dockerfile
    container_name: rheosim-ml
    environment:
      RHEOSIM_ML_GRPC_PORT: "50052"
      RHEOSIM_ML_HTTP_PORT: "8000"
      RHEOSIM_ML_MODEL_DIR: "/app/models"
      RHEOSIM_ML_API_KEY: ${ML_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:50052:50052"
    volumes:
      - ml_models:/app/models
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - rheosim-net

  backend:
    build:
      context: ../rheosim-backend
      dockerfile: Dockerfile
    container_name: rheosim-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rheosim_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rheosim}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rheosim-net

  frontend:
    build:
      context: ../rheosim-frontend
      dockerfile: Dockerfile
    container_name: rheosim-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - rheosim-net

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  ml_models:

networks:
  rheosim-net:
    driver: bridge
